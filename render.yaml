services:
  - type: web
    name: moa-leads
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/leads.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
