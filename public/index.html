<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOA Leads</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            padding: 15px;
            line-height: 1.6;
        }
        h1 { font-size: 1.4em; margin-bottom: 5px; color: #fff; }
        .subtitle { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-secondary { background: #333; }
        .btn:hover { opacity: 0.9; }
        .filters { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filters input, .filters select {
            background: #1a1a1f;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: #15151a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            font-size: 0.85em;
        }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #1f1f25; color: #888; font-size: 0.75rem; text-transform: uppercase; }
        tr:hover { background: #1f1f25; }
        .business { font-weight: 600; }
        .business a { color: #fff; text-decoration: none; }
        .phone a { color: #60a5fa; text-decoration: none; }
        .status-cold { color: #9ca3af; }
        .status-contacted { color: #fbbf24; }
        .status-qualified { color: #34d399; }
        .priority-high { color: #f87171; font-weight: 600; }
        .priority-medium { color: #fbbf24; }
        .priority-low { color: #60a5fa; }
        .loading { text-align: center; padding: 50px; color: #666; }
        .error { color: #f87171; text-align: center; padding: 20px; }
        .empty { text-align: center; padding: 40px; color: #666; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a1f;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header { padding: 20px; border-bottom: 1px solid #333; }
        .modal-header h2 { font-size: 1.2rem; }
        .modal-body { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #888; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: #0f0f12;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; }
        .actions-cell { display: flex; gap: 8px; }
        .actions-cell button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .actions-cell button:hover { border-color: #666; color: #fff; }
        .btn-email { background: #2563eb !important; color: white !important; border-color: #2563eb !important; }
        .placeholder-tag {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin: 2px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.2em; }
            th, td { padding: 8px; font-size: 0.8em; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>My Office Assistant</h1>
    <div class="subtitle">Lead Dashboard</div>
    
    <div class="actions">
        <button class="btn" onclick="openModal()">+ Add Lead</button>
        <button class="btn btn-secondary" onclick="loadLeads()">Refresh</button>
    </div>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Search..." oninput="filterLeads()">
        <select id="statusFilter" onchange="filterLeads()">
            <option value="">All Status</option>
            <option value="cold">Cold</option>
            <option value="contacted">Contacted</option>
            <option value="qualified">Qualified</option>
        </select>
    </div>

    <div id="content"><div class="loading">Loading leads...</div></div>

    <!-- Lead Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header"><h2 id="modalTitle">Add Lead</h2></div>
            <div class="modal-body">
                <input type="hidden" id="leadId">
                <div class="form-group"><label>Business Name *</label><input type="text" id="businessName" required></div>
                <div class="form-row">
                    <div class="form-group"><label>Contact Name</label><input type="text" id="contactName"></div>
                    <div class="form-group"><label>Industry</label>
                        <select id="industry">
                            <option value="">Select...</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="HVAC">HVAC</option>
                            <option value="Locksmith">Locksmith</option>
                            <option value="Garage Door">Garage Door</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Phone</label><input type="tel" id="phone"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email"></div>
                </div>
                <div class="form-group"><label>Website</label><input type="url" id="website" placeholder="https://..."></div>
                <div class="form-row">
                    <div class="form-group"><label>Status</label>
                        <select id="status">
                            <option value="cold">Cold</option>
                            <option value="contacted">Contacted</option>
                            <option value="qualified">Qualified</option>
                            <option value="closed-won">Closed Won</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Priority</label>
                        <select id="priority">
                            <option value="high">High</option>
                            <option value="medium" selected>Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Notes</label><textarea id="notes" rows="3"></textarea></div>
                <div class="form-group"><label>Call Script</label><textarea id="callScript" rows="4" placeholder="Your cold call script for this lead..."></textarea></div>
                <div class="form-group"><label>Why They're a Good Fit</label><textarea id="whyGoodFit" rows="4" placeholder="Research on why this lead is a good prospect..."></textarea></div>
                <div class="form-group"><label>Review Evidence</label><textarea id="reviewEvidence" rows="3" placeholder="Specific review quotes mentioning phones, busy schedules, etc..."></textarea></div>
                <div class="form-group"><label>Reasons to Buy</label><textarea id="reasonsToBuy" rows="3" placeholder="Why they need your service..."></textarea></div>
                <div class="form-group"><label>Proof/Reviews</label><textarea id="proofReviews" rows="3" placeholder="Testimonials, case studies, review links..."></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="saveLead()">Save</button>
            </div>
        </div>
    </div>

    <!-- View Lead Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="viewModalTitle">Lead Details</h2>
            </div>
            <div class="modal-body" id="viewModalBody">
                <!-- Content populated by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
                <button class="btn" onclick="editFromView()">Edit</button>
            </div>
        </div>
    </div>

    <!-- Email Modal -->
    <div class="modal-overlay" id="emailModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header"><h2 id="emailModalTitle">Compose Email</h2></div>
            <div class="modal-body">
                <input type="hidden" id="emailLeadId">
                <div class="form-group">
                    <label>Template</label>
                    <select id="emailTemplate" onchange="applyEmailTemplate()">
                        <option value="">-- Select Template --</option>
                        <option value="intro">Cold Intro (Recommended)</option>
                        <option value="followup">Follow-up</option>
                        <option value="short">Short & Sweet</option>
                    </select>
                </div>
                <div class="form-group"><label>Subject</label><input type="text" id="emailSubject"></div>
                <div class="form-group"><label>Email Body</label><textarea id="emailBody" rows="12"></textarea></div>
                <div style="background: #1a1a1f; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; color: #888; margin-bottom: 8px; display: block;">Click to insert placeholders:</label>
                    <div>
                        <span class="placeholder-tag" onclick="insertPlaceholder('{{business_name}}')">{{business_name}}</span>
                        <span class="placeholder-tag" onclick="insertPlaceholder('{{contact_name}}')">{{contact_name}}</span>
                        <span class="placeholder-tag" onclick="insertPlaceholder('{{industry}}')">{{industry}}</span>
                        <span class="placeholder-tag" onclick="insertPlaceholder('{{phone}}')">{{phone}}</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Preview (with placeholders replaced):</label>
                    <div id="emailPreview" style="background: #0f0f12; padding: 15px; border-radius: 6px; white-space: pre-wrap; color: #888; max-height: 200px; overflow-y: auto;">Start typing to see preview...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEmailModal()">Cancel</button>
                <button class="btn" onclick="copyEmail()">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        let allLeads = [];
        let currentEmailLead = null;

        const emailTemplates = {
            intro: {
                subject: "Quick question about {{business_name}} - from a fellow local business owner",
                body: "Hi {{contact_name}},\n\nI came across {{business_name}} while researching {{industry}} businesses in the area. My name is Gabe and I run My Office Assistant - we help local service businesses handle their phones so they never miss a customer.\n\nI know you're probably busy running {{business_name}}, so I'll keep this short. We set up AI receptionists that answer calls, book appointments, and send texts - basically handling the phone stuff that eats up your day.\n\nIs that something you've thought about, or are you pretty set with how you're handling calls right now?\n\nEither way, no pressure. Just wanted to introduce myself since we're both local.\n\nBest,\nGabe\nMy Office Assistant\n(Your local AI receptionist service)\n\nP.S. If you ever want to chat about it over coffee, I'm around. Just reply to this email or text me at the number below."
            },
            followup: {
                subject: "Following up - {{business_name}}",
                body: "Hey {{contact_name}},\n\nJust wanted to follow up on my email from last week. No rush at all - I know you're busy running {{business_name}}.\n\nTo recap: I'm Gabe from My Office Assistant. We help local {{industry}} businesses like {{business_name}} handle their phone calls automatically, so you can focus on the actual work instead of constantly answering the phone.\n\nQuick question: What's your biggest frustration with how you're currently handling calls? Just curious if it's even a pain point for you.\n\nIf it's not something you're looking for right now, totally get it. But if you're open to a 10-minute conversation about it, I'd love to learn more about how {{business_name}} operates.\n\nWhen's a good time to chat?\n\nGabe\nMy Office Assistant\n\nP.S. You can also just text me back if that's easier: (707) 555-XXXX"
            },
            short: {
                subject: "{{business_name}} - quick intro",
                body: "Hi {{contact_name}},\n\nI'm Gabe from My Office Assistant - we help local {{industry}} businesses handle their calls so they don't miss customers.\n\nWanted to see if that's something {{business_name}} has struggled with at all?\n\nHappy to chat whenever you're free. I'm local so I can meet up or call - whatever's easier.\n\nGabe\nMy Office Assistant\n\nText or call: (707) 555-XXXX"
            }
        };

        async function loadLeads() {
            try {
                const res = await fetch('/api/leads');
                allLeads = await res.json();
                renderLeads(allLeads);
            } catch (err) {
                document.getElementById('content').innerHTML = '<div class="error">Error: ' + err.message + '</div>';
            }
        }

        function renderLeads(leads) {
            const content = document.getElementById('content');
            if (leads.length === 0) {
                content.innerHTML = '<div class="empty">No leads yet. Click "Add Lead" to get started.</div>';
                return;
            }
            const html = '<table><thead><tr>' +
                '<th>Business</th><th>Phone</th><th>Industry</th><th>Status</th><th>Priority</th><th>Actions</th>' +
                '</tr></thead><tbody>' +
                leads.map(l => {
                    const phoneLink = l.phone ? '<a href="tel:' + l.phone + '">' + l.phone + '</a>' : '-';
                    const businessLink = l.website ? '<a href="' + l.website + '" target="_blank">' + escapeHtml(l.business_name) + ' ↗</a>' : escapeHtml(l.business_name);
                    return '<tr>' +
                        '<td class="business">' + businessLink + '</td>' +
                        '<td class="phone">' + phoneLink + '</td>' +
                        '<td>' + (l.industry || '-') + '</td>' +
                        '<td class="status-' + l.status + '" style="text-transform: capitalize;">' + l.status + '</td>' +
                        '<td class="priority-' + l.priority + '" style="text-transform: capitalize;">' + l.priority + '</td>' +
                        '<td class="actions-cell">' +
                            '<button onclick="viewLead(' + l.id + ')">View</button>' +
                            '<button onclick="editLead(' + l.id + ')">Edit</button>' +
                            '<button class="btn-email" onclick="openEmailModal(' + l.id + ')">Email</button>' +
                            '<button onclick="deleteLead(' + l.id + ')">Delete</button>' +
                        '</td>' +
                    '</tr>';
                }).join('') + '</tbody></table>';
            content.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterLeads() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const filtered = allLeads.filter(l => {
                const matchesSearch = !search || 
                    (l.business_name && l.business_name.toLowerCase().includes(search)) ||
                    (l.industry && l.industry.toLowerCase().includes(search));
                const matchesStatus = !status || l.status === status;
                return matchesSearch && matchesStatus;
            });
            renderLeads(filtered);
        }

        function openModal() {
            document.getElementById('modalTitle').textContent = 'Add Lead';
            document.getElementById('leadId').value = '';
            document.getElementById('businessName').value = '';
            document.getElementById('contactName').value = '';
            document.getElementById('industry').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('email').value = '';
            document.getElementById('website').value = '';
            document.getElementById('status').value = 'cold';
            document.getElementById('priority').value = 'medium';
            document.getElementById('notes').value = '';
            document.getElementById('callScript').value = '';
            document.getElementById('whyGoodFit').value = '';
            document.getElementById('reviewEvidence').value = '';
            document.getElementById('reasonsToBuy').value = '';
            document.getElementById('proofReviews').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function editLead(id) {
            const lead = allLeads.find(l => l.id === id);
            if (!lead) return;
            document.getElementById('modalTitle').textContent = 'Edit Lead';
            document.getElementById('leadId').value = lead.id;
            document.getElementById('businessName').value = lead.business_name || '';
            document.getElementById('contactName').value = lead.contact_name || '';
            document.getElementById('industry').value = lead.industry || '';
            document.getElementById('phone').value = lead.phone || '';
            document.getElementById('email').value = lead.email || '';
            document.getElementById('website').value = lead.website || '';
            document.getElementById('status').value = lead.status || 'cold';
            document.getElementById('priority').value = lead.priority || 'medium';
            document.getElementById('notes').value = lead.notes || '';
            document.getElementById('callScript').value = lead.call_script || '';
            document.getElementById('whyGoodFit').value = lead.why_good_fit || '';
            document.getElementById('reviewEvidence').value = lead.review_evidence || '';
            document.getElementById('reasonsToBuy').value = lead.reasons_to_buy || '';
            document.getElementById('proofReviews').value = lead.proof_reviews || '';
            document.getElementById('modal').classList.add('active');
        }

        async function saveLead() {
            const id = document.getElementById('leadId').value;
            const data = {
                business_name: document.getElementById('businessName').value,
                contact_name: document.getElementById('contactName').value,
                industry: document.getElementById('industry').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                website: document.getElementById('website').value,
                status: document.getElementById('status').value,
                priority: document.getElementById('priority').value,
                notes: document.getElementById('notes').value,
                call_script: document.getElementById('callScript').value,
                why_good_fit: document.getElementById('whyGoodFit').value,
                review_evidence: document.getElementById('reviewEvidence').value,
                reasons_to_buy: document.getElementById('reasonsToBuy').value,
                proof_reviews: document.getElementById('proofReviews').value
            };
            if (!data.business_name) { alert('Business name required'); return; }
            try {
                if (id) {
                    await fetch('/api/leads/' + id, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    await fetch('/api/leads', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }
                closeModal();
                loadLeads();
            } catch (err) { alert('Failed to save'); }
        }

        async function deleteLead(id) {
            if (!confirm('Delete this lead?')) return;
            try {
                await fetch('/api/leads/' + id, { method: 'DELETE' });
                loadLeads();
            } catch (err) { alert('Failed to delete'); }
        }

        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        let currentViewLeadId = null;

        function viewLead(id) {
            const lead = allLeads.find(l => l.id === id);
            if (!lead) return;
            currentViewLeadId = id;
            document.getElementById('viewModalTitle').textContent = lead.business_name;
            
            const phoneLink = lead.phone ? '<a href="tel:' + lead.phone + '" style="color: #60a5fa;">' + lead.phone + '</a>' : '-';
            const websiteLink = lead.website ? '<a href="' + lead.website + '" target="_blank" style="color: #60a5fa;">' + lead.website + ' ↗</a>' : '-';
            
            document.getElementById('viewModalBody').innerHTML = 
                '<div style="margin-bottom: 20px;">' +
                    '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">' +
                        '<div><strong>Contact:</strong> ' + (lead.contact_name || '-') + '</div>' +
                        '<div><strong>Industry:</strong> ' + (lead.industry || '-') + '</div>' +
                        '<div><strong>Phone:</strong> ' + phoneLink + '</div>' +
                        '<div><strong>Email:</strong> ' + (lead.email || '-') + '</div>' +
                    '</div>' +
                    '<div style="margin-bottom: 10px;"><strong>Website:</strong> ' + websiteLink + '</div>' +
                    '<div style="display: flex; gap: 15px; margin-bottom: 15px;">' +
                        '<span><strong>Status:</strong> <span class="status-' + lead.status + '">' + lead.status + '</span></span>' +
                        '<span><strong>Priority:</strong> <span class="priority-' + lead.priority + '">' + lead.priority + '</span></span>' +
                    '</div>' +
                '</div>' +
                '<div style="background: #1a1a1f; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px;">' +
                    '<h3 style="color: #2563eb; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase;">Call Script</h3>' +
                    '<div style="white-space: pre-wrap; color: #e0e0e0;">' + (lead.call_script ? escapeHtml(lead.call_script) : '<em style="color: #666;">No call script added yet. Click Edit to add one.</em>') + '</div>' +
                '</div>' +
                '<div style="background: #1a1a1f; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px;">' +
                    '<h3 style="color: #34d399; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase;">Why They Need Us (Reasons to Buy)</h3>' +
                    '<div style="white-space: pre-wrap; color: #e0e0e0;">' + (lead.reasons_to_buy ? escapeHtml(lead.reasons_to_buy) : '<em style="color: #666;">No reasons added yet. Click Edit to add.</em>') + '</div>' +
                '</div>' +
                '<div style="background: #1a1a1f; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px;">' +
                    '<h3 style="color: #a855f7; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase;">Why They\'re a Good Fit</h3>' +
                    '<div style="white-space: pre-wrap; color: #e0e0e0;">' + (lead.why_good_fit ? escapeHtml(lead.why_good_fit) : '<em style="color: #666;">No research added yet.</em>') + '</div>' +
                '</div>' +
                '<div style="background: #1a1a1f; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px;">' +
                    '<h3 style="color: #06b6d4; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase;">Review Evidence</h3>' +
                    '<div style="white-space: pre-wrap; color: #e0e0e0;">' + (lead.review_evidence ? escapeHtml(lead.review_evidence) : '<em style="color: #666;">No review research added yet.</em>') + '</div>' +
                '</div>' +
                '<div style="background: #1a1a1f; border: 1px solid #333; border-radius: 8px; padding: 15px;">' +
                    '<h3 style="color: #fbbf24; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase;">Reviews</h3>' +
                    '<div style="white-space: pre-wrap; color: #e0e0e0;">' + (lead.proof_reviews ? escapeHtml(lead.proof_reviews) : '<em style="color: #666;">No reviews added yet. Click Edit to add.</em>') + '</div>' +
                '</div>' +
                (lead.notes ? '<div style="background: #1a1a1f; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-top: 15px;">' +
                    '<h3 style="color: #888; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase;">Notes</h3>' +
                    '<div style="white-space: pre-wrap; color: #e0e0e0;">' + escapeHtml(lead.notes) + '</div>' +
                '</div>' : '');
            
            document.getElementById('viewModal').classList.add('active');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('active');
            currentViewLeadId = null;
        }

        function editFromView() {
            closeViewModal();
            if (currentViewLeadId) {
                editLead(currentViewLeadId);
            }
        }

        document.getElementById('viewModal').addEventListener('click', function(e) { if (e.target === this) closeViewModal(); });

        // Email functions
        function openEmailModal(leadId) {
            currentEmailLead = allLeads.find(l => l.id === leadId);
            if (!currentEmailLead) return;
            document.getElementById('emailLeadId').value = leadId;
            document.getElementById('emailModalTitle').textContent = 'Email: ' + currentEmailLead.business_name;
            document.getElementById('emailTemplate').value = '';
            document.getElementById('emailSubject').value = '';
            document.getElementById('emailBody').value = '';
            document.getElementById('emailPreview').textContent = 'Select a template or start typing...';
            document.getElementById('emailModal').classList.add('active');
        }

        function closeEmailModal() {
            document.getElementById('emailModal').classList.remove('active');
            currentEmailLead = null;
        }

        function applyEmailTemplate() {
            if (!currentEmailLead) return;
            const templateKey = document.getElementById('emailTemplate').value;
            if (!templateKey) return;
            const template = emailTemplates[templateKey];
            const contactName = currentEmailLead.contact_name || 'there';
            let subject = template.subject
                .replace(/{{business_name}}/g, currentEmailLead.business_name)
                .replace(/{{contact_name}}/g, contactName)
                .replace(/{{industry}}/g, currentEmailLead.industry || 'service');
            let body = template.body
                .replace(/{{business_name}}/g, currentEmailLead.business_name)
                .replace(/{{contact_name}}/g, contactName)
                .replace(/{{industry}}/g, currentEmailLead.industry || 'service')
                .replace(/{{phone}}/g, currentEmailLead.phone || '');
            document.getElementById('emailSubject').value = subject;
            document.getElementById('emailBody').value = body;
            updateEmailPreview();
        }

        function insertPlaceholder(placeholder) {
            const body = document.getElementById('emailBody');
            const start = body.selectionStart;
            const end = body.selectionEnd;
            const text = body.value;
            body.value = text.substring(0, start) + placeholder + text.substring(end);
            body.focus();
            body.setSelectionRange(start + placeholder.length, start + placeholder.length);
            updateEmailPreview();
        }

        function updateEmailPreview() {
            if (!currentEmailLead) return;
            const subject = document.getElementById('emailSubject').value;
            const body = document.getElementById('emailBody').value;
            const contactName = currentEmailLead.contact_name || 'there';
            const preview = (subject + '\n\n' + body)
                .replace(/{{business_name}}/g, currentEmailLead.business_name)
                .replace(/{{contact_name}}/g, contactName)
                .replace(/{{industry}}/g, currentEmailLead.industry || 'service')
                .replace(/{{phone}}/g, currentEmailLead.phone || '');
            document.getElementById('emailPreview').textContent = preview || 'Start typing to see preview...';
        }

        function copyEmail() {
            const subject = document.getElementById('emailSubject').value;
            const body = document.getElementById('emailBody').value;
            const contactName = currentEmailLead.contact_name || 'there';
            const finalText = (subject + '\n\n' + body)
                .replace(/{{business_name}}/g, currentEmailLead.business_name)
                .replace(/{{contact_name}}/g, contactName)
                .replace(/{{industry}}/g, currentEmailLead.industry || 'service')
                .replace(/{{phone}}/g, currentEmailLead.phone || '');
            navigator.clipboard.writeText(finalText).then(() => {
                alert('Email copied to clipboard!');
                closeEmailModal();
            }).catch(() => alert('Failed to copy. Please select and copy manually.'));
        }

        document.getElementById('emailModal').addEventListener('click', function(e) { if (e.target === this) closeEmailModal(); });
        document.getElementById('emailSubject').addEventListener('input', updateEmailPreview);
        document.getElementById('emailBody').addEventListener('input', updateEmailPreview);

        loadLeads();
    </script>
</body>
</html>
