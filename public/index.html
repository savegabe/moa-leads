<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOA Leads</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; padding: 10px; margin: 0; }
        h1 { font-size: 1.2em; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #1a1a1a; position: sticky; top: 0; }
        tr:hover { background: #1a1a1a; }
        .business { font-weight: bold; color: #60a5fa; }
        .status-cold { color: #9ca3af; }
        .status-contacted { color: #fbbf24; }
        .status-qualified { color: #34d399; }
        .priority-high { color: #f87171; }
        .loading { text-align: center; padding: 50px; color: #666; }
        .error { color: #f87171; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1>My Office Assistant - Leads</h1>
    <div id="content">
        <div class="loading">Loading...</div>
    </div>

    <script>
        fetch('/api/leads')
            .then(r => r.json())
            .then(leads => {
                const html = '<table><thead><tr>' +
                    '<th>Business</th>' +
                    '<th>Phone</th>' +
                    '<th>Industry</th>' +
                    '<th>Status</th>' +
                    '</tr></thead><tbody>' +
                    leads.map(l => '<tr>' +
                        '<td class="business">' + (l.business_name || '-') + '</td>' +
                        '<td>' + (l.phone || '-') + '</td>' +
                        '<td>' + (l.industry || '-') + '</td>' +
                        '<td class="status-' + l.status + '">' + l.status + '</td>' +
                    '</tr>').join('') +
                    '</tbody></table>';
                document.getElementById('content').innerHTML = html;
            })
            .catch(e => {
                document.getElementById('content').innerHTML = 
                    '<div class="error">Error: ' + e.message + '</div>';
            });
    </script>
</body>
</html>
