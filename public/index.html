<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOA Leads</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            padding: 15px;
            line-height: 1.6;
        }
        h1 { 
            font-size: 1.4em; 
            margin-bottom: 5px;
            color: #fff;
            font-weight: 600;
        }
        .subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-secondary {
            background: #333;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            background: #1a1a1f;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: #15151a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            font-size: 0.85em;
        }
        th, td { 
            padding: 12px; 
            text-align: left; 
            border-bottom: 1px solid #333; 
        }
        th { 
            background: #1f1f25; 
            color: #888;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        tr:hover { background: #1f1f25; }
        .business { 
            font-weight: 600; 
            color: #60a5fa; 
        }
        .business a {
            color: #fff;
            text-decoration: none;
        }
        .phone a {
            color: #60a5fa;
            text-decoration: none;
        }
        .status-cold { color: #9ca3af; }
        .status-contacted { color: #fbbf24; }
        .status-qualified { color: #34d399; }
        .priority-high { color: #f87171; font-weight: 600; }
        .priority-medium { color: #fbbf24; }
        .priority-low { color: #60a5fa; }
        .loading { text-align: center; padding: 50px; color: #666; }
        .error { color: #f87171; text-align: center; padding: 20px; }
        .empty { text-align: center; padding: 40px; color: #666; }
        
        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1a1a1f;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        .modal-header h2 {
            font-size: 1.2rem;
        }
        .modal-body {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #888;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: #0f0f12;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .actions-cell {
            display: flex;
            gap: 8px;
        }
        .actions-cell button {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .actions-cell button:hover {
            border-color: #666;
            color: #fff;
        }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.2em; }
            th, td { padding: 8px; font-size: 0.8em; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>My Office Assistant</h1>
    <div class="subtitle">Lead Dashboard</div>
    
    <div class="actions">
        <button class="btn" onclick="openModal()">+ Add Lead</button>
        <button class="btn btn-secondary" onclick="loadLeads()">Refresh</button>
    </div>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Search..." oninput="filterLeads()">
        <select id="statusFilter" onchange="filterLeads()">
            <option value="">All Status</option>
            <option value="cold">Cold</option>
            <option value="contacted">Contacted</option>
            <option value="qualified">Qualified</option>
        </select>
    </div>

    <div id="content">
        <div class="loading">Loading leads...</div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Lead</h2>
            </div>
            <div class="modal-body">
                <input type="hidden" id="leadId">
                
                <div class="form-group">
                    <label>Business Name *</label>
                    <input type="text" id="businessName" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Contact Name</label>
                        <input type="text" id="contactName">
                    </div>
                    <div class="form-group">
                        <label>Industry</label>
                        <select id="industry">
                            <option value="">Select...</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="HVAC">HVAC</option>
                            <option value="Locksmith">Locksmith</option>
                            <option value="Garage Door">Garage Door</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email">
                    </div>
                </div>

                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="website" placeholder="https://...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="cold">Cold</option>
                            <option value="contacted">Contacted</option>
                            <option value="qualified">Qualified</option>
                            <option value="closed-won">Closed Won</option>
                            <option value="closed-lost">Closed Lost</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="priority">
                            <option value="high">High</option>
                            <option value="medium" selected>Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="saveLead()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let allLeads = [];

        async function loadLeads() {
            try {
                const res = await fetch('/api/leads');
                allLeads = await res.json();
                renderLeads(allLeads);
            } catch (err) {
                document.getElementById('content').innerHTML = 
                    '<div class="error">Error: ' + err.message + '</div>';
            }
        }

        function renderLeads(leads) {
            const content = document.getElementById('content');
            
            if (leads.length === 0) {
                content.innerHTML = '<div class="empty">No leads yet. Click "Add Lead" to get started.</div>';
                return;
            }

            const html = '<table><thead><tr>' +
                '<th>Business</th>' +
                '<th>Phone</th>' +
                '<th>Industry</th>' +
                '<th>Status</th>' +
                '<th>Priority</th>' +
                '<th>Actions</th>' +
                '</tr></thead><tbody>' +
                leads.map(l => {
                    const phoneLink = l.phone ? `<a href="tel:${l.phone}">${l.phone}</a>` : '-';
                    const businessLink = l.website 
                        ? `<a href="${l.website}" target="_blank">${l.business_name} ↗</a>` 
                        : l.business_name;
                    return '<tr>' +
                        '<td class="business">' + businessLink + '</td>' +
                        '<td class="phone">' + phoneLink + '</td>' +
                        '<td>' + (l.industry || '-') + '</td>' +
                        '<td class="status-' + l.status + '" style="text-transform: capitalize;">' + l.status + '</td>' +
                        '<td class="priority-' + l.priority + '" style="text-transform: capitalize;">' + l.priority + '</td>' +
                        '<td class="actions-cell">' +
                            '<button onclick="editLead(' + l.id + ')">Edit</button>' +
                            '<button onclick="deleteLead(' + l.id + ')">Delete</button>' +
                        '</td>' +
                    '</tr>';
                }).join('') +
                '</tbody></table>';
            
            content.innerHTML = html;
        }

        function filterLeads() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            const filtered = allLeads.filter(l => {
                const matchesSearch = !search || 
                    (l.business_name && l.business_name.toLowerCase().includes(search)) ||
                    (l.industry && l.industry.toLowerCase().includes(search));
                const matchesStatus = !status || l.status === status;
                return matchesSearch && matchesStatus;
            });
            
            renderLeads(filtered);
        }

        function openModal() {
            document.getElementById('modalTitle').textContent = 'Add Lead';
            document.getElementById('leadId').value = '';
            document.getElementById('businessName').value = '';
            document.getElementById('contactName').value = '';
            document.getElementById('industry').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('email').value = '';
            document.getElementById('website').value = '';
            document.getElementById('status').value = 'cold';
            document.getElementById('priority').value = 'medium';
            document.getElementById('notes').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function editLead(id) {
            const lead = allLeads.find(l => l.id === id);
            if (!lead) return;

            document.getElementById('modalTitle').textContent = 'Edit Lead';
            document.getElementById('leadId').value = lead.id;
            document.getElementById('businessName').value = lead.business_name || '';
            document.getElementById('contactName').value = lead.contact_name || '';
            document.getElementById('industry').value = lead.industry || '';
            document.getElementById('phone').value = lead.phone || '';
            document.getElementById('email').value = lead.email || '';
            document.getElementById('website').value = lead.website || '';
            document.getElementById('status').value = lead.status || 'cold';
            document.getElementById('priority').value = lead.priority || 'medium';
            document.getElementById('notes').value = lead.notes || '';
            document.getElementById('modal').classList.add('active');
        }

        async function saveLead() {
            const id = document.getElementById('leadId').value;
            const data = {
                business_name: document.getElementById('businessName').value,
                contact_name: document.getElementById('contactName').value,
                industry: document.getElementById('industry').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                website: document.getElementById('website').value,
                status: document.getElementById('status').value,
                priority: document.getElementById('priority').value,
                notes: document.getElementById('notes').value
            };

            if (!data.business_name) {
                alert('Business name required');
                return;
            }

            try {
                if (id) {
                    await fetch('/api/leads/' + id, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    await fetch('/api/leads', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }
                closeModal();
                loadLeads();
            } catch (err) {
                alert('Failed to save');
            }
        }

        async function deleteLead(id) {
            if (!confirm('Delete this lead?')) return;
            try {
                await fetch('/api/leads/' + id, { method: 'DELETE' });
                loadLeads();
            } catch (err) {
                alert('Failed to delete');
            }
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Load on start
        loadLeads();
    </script>
</body>
</html>
