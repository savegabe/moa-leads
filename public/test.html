<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
<body>
    <h1>Dashboard Test</h1>
    <div id="status">Loading...</div>
    <div id="leads"></div>
    
    <script>
        // Simple inline test - no external deps
        async function test() {
            try {
                const res = await fetch('/api/leads');
                const data = await res.json();
                document.getElementById('status').textContent = 'Loaded ' + data.length + ' leads';
                document.getElementById('leads').innerHTML = data.map(l => 
                    '<p>' + l.business_name + '</p>'
                ).join('');
            } catch (e) {
                document.getElementById('status').textContent = 'Error: ' + e.message;
            }
        }
        test();
        // Fallback
        setTimeout(() => {
            if (document.getElementById('status').textContent === 'Loading...') {
                document.getElementById('status').textContent = 'Timeout - check console';
            }
        }, 3000);
    </script>
</body>
</html>
